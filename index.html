<script>
// WATER layer — background (gradient, god rays, sand, caustics) + overlay (surface waves, bubbles)
(function () {
  'use strict';

  // ---- seeded RNG (mulberry32) ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0;

  // precomputed geometry
  var duneXs = [];        // x coords of dune curve
  var duneYs = [];        // y coords of dune curve
  var rays = [];          // god rays {x, w, slant, phase, speed, alpha}
  var ripples = [];       // sand ripple marks {x, y, w, h}
  var pebbles = [];       // {x, y, r, squash}
  var cells = [];         // caustic cells {cx, cy, r, phx, phy, f1, f2}
  var bubbles = [];       // {x0, y0, r, speed, wobble, phase}
  var waterGrad = null;

  var DUNE_STEPS = 64;

  function build(w, h) {
    W = w; H = h;
    var rnd = mulberry32((window.SCENE_SEED >>> 0) || 1337);

    // water gradient (rebuilt per size; ctx-independent gradients need a ctx,
    // so we build it lazily in drawBackground on first use per size)
    waterGrad = null;

    // ---- dune curve around y = 0.78h ----
    duneXs.length = 0; duneYs.length = 0;
    var p1 = rnd() * Math.PI * 2, p2 = rnd() * Math.PI * 2, p3 = rnd() * Math.PI * 2;
    for (var i = 0; i <= DUNE_STEPS; i++) {
      var x = (i / DUNE_STEPS) * w;
      var u = i / DUNE_STEPS;
      var y = 0.78 * h
        + Math.sin(u * Math.PI * 2 * 1.3 + p1) * 0.014 * h
        + Math.sin(u * Math.PI * 2 * 2.7 + p2) * 0.008 * h
        + Math.sin(u * Math.PI * 2 * 4.1 + p3) * 0.004 * h;
      duneXs.push(x); duneYs.push(y);
    }

    // ---- god rays ----
    rays.length = 0;
    var nRays = 4;
    for (var r = 0; r < nRays; r++) {
      rays.push({
        x: (0.1 + 0.8 * (r / (nRays - 1)) + (rnd() - 0.5) * 0.08) * w,
        w: (0.05 + rnd() * 0.06) * w,
        slant: (0.10 + rnd() * 0.16) * w, // consistent slant direction
        phase: rnd() * Math.PI * 2,
        speed: 0.15 + rnd() * 0.12,
        alpha: 0.05 + rnd() * 0.03
      });
    }

    // ---- sand ripples (thin lens shapes) ----
    ripples.length = 0;
    for (var k = 0; k < 14; k++) {
      var rx = rnd() * w;
      var ry = (0.82 + rnd() * 0.15) * h;
      ripples.push({ x: rx, y: ry, w: (0.03 + rnd() * 0.05) * w, h: 2 + rnd() * 3 });
    }

    // ---- pebbles ----
    pebbles.length = 0;
    for (var pb = 0; pb < 7; pb++) {
      pebbles.push({
        x: rnd() * w,
        y: (0.84 + rnd() * 0.13) * h,
        r: 3 + rnd() * 5,
        squash: 0.55 + rnd() * 0.2
      });
    }

    // ---- caustic cell grid over the sand band ----
    cells.length = 0;
    var cols = Math.max(8, Math.round(w / 130));
    var rows = 3;
    var sandTop = 0.78 * h, sandH = h - sandTop;
    for (var cy = 0; cy < rows; cy++) {
      for (var cx = 0; cx < cols; cx++) {
        cells.push({
          cx: ((cx + 0.5) / cols + (rnd() - 0.5) * 0.06) * w,
          cy: sandTop + ((cy + 0.5) / rows + (rnd() - 0.5) * 0.2) * sandH,
          r: (0.35 + rnd() * 0.35) * (w / cols) * 0.55,
          phx: rnd() * Math.PI * 2,
          phy: rnd() * Math.PI * 2,
          f1: 0.7 + rnd() * 0.5,   // slow component ~ period 5-9s
          f2: 1.6 + rnd() * 0.8
        });
      }
    }

    // ---- bubbles ----
    bubbles.length = 0;
    for (var b = 0; b < 8; b++) {
      bubbles.push({
        x0: rnd() * w,
        off: rnd() * h,               // vertical phase offset
        r: 1.5 + rnd() * 2.5,
        speed: 14 + rnd() * 18,       // px/s upward
        wobble: 4 + rnd() * 8,
        phase: rnd() * Math.PI * 2
      });
    }
  }

  function drawBackground(ctx, t) {
    // ---- water gradient, full frame ----
    if (!waterGrad) {
      waterGrad = ctx.createLinearGradient(0, 0, 0, H);
      waterGrad.addColorStop(0, '#4a7d99');
      waterGrad.addColorStop(1, '#27455c');
    }
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, 0, W, H);

    // ---- god rays: slanted quads with vertical fade ----
    var rayBottom = 0.85 * H;
    for (var i = 0; i < rays.length; i++) {
      var ray = rays[i];
      var sway = Math.sin(t * ray.speed + ray.phase) * 0.03 * W;
      var pulse = 0.75 + 0.25 * Math.sin(t * ray.speed * 1.7 + ray.phase * 2);
      var topX = ray.x + sway;
      var botX = topX + ray.slant;
      var g = ctx.createLinearGradient(0, 0, 0, rayBottom);
      g.addColorStop(0, 'rgba(255,246,220,' + (ray.alpha * pulse).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,246,220,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(topX - ray.w * 0.5, 0);
      ctx.lineTo(topX + ray.w * 0.5, 0);
      ctx.lineTo(botX + ray.w * 0.9, rayBottom);
      ctx.lineTo(botX - ray.w * 0.9, rayBottom);
      ctx.closePath();
      ctx.fill();
    }

    // ---- sand floor ----
    ctx.fillStyle = '#e6d69f';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(duneXs[0], duneYs[0]);
    for (var d = 1; d <= DUNE_STEPS; d++) ctx.lineTo(duneXs[d], duneYs[d]);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // ripple marks (thin lenses)
    ctx.fillStyle = '#c9b878';
    for (var k = 0; k < ripples.length; k++) {
      var rp = ripples[k];
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rp.w * 0.5, rp.h * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // pebbles (shadow tone)
    for (var pb = 0; pb < pebbles.length; pb++) {
      var p = pebbles[pb];
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r, p.r * p.squash, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- caustics: clipped to sand region ----
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(duneXs[0], duneYs[0]);
    for (var d2 = 1; d2 <= DUNE_STEPS; d2++) ctx.lineTo(duneXs[d2], duneYs[d2]);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.clip();

    ctx.fillStyle = 'rgba(255,250,225,0.10)';
    for (var c = 0; c < cells.length; c++) {
      var cell = cells[c];
      var dx = Math.sin(t * cell.f1 + cell.phx) * 18
             + Math.sin(t * cell.f2 * 0.5 + cell.cx * 0.01) * 9;
      var dy = Math.sin(t * cell.f1 * 0.8 + cell.phy) * 6
             + Math.sin(t * cell.f2 * 0.4 + cell.cx * 0.007 + 1.7) * 4;
      var stretch = 1 + 0.25 * Math.sin(t * cell.f1 * 0.6 + cell.phx + cell.phy);
      ctx.beginPath();
      ctx.ellipse(cell.cx + dx, cell.cy + dy, cell.r * stretch, cell.r * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawOverlay(ctx, t) {
    // ---- surface wave band, top ~6% ----
    var bandH = 0.06 * H;
    drawWave(ctx, t, bandH * 0.55, bandH * 0.28, 0.9, 22, 'rgba(111,163,189,0.30)');
    drawWave(ctx, t, bandH * 0.85, bandH * 0.22, -0.6, 34, 'rgba(130,180,205,0.25)');

    // ---- bubbles ----
    ctx.fillStyle = 'rgba(220,240,250,0.28)';
    for (var b = 0; b < bubbles.length; b++) {
      var bb = bubbles[b];
      var travel = H + 40;
      var y = travel - ((bb.off + t * bb.speed) % travel) - 20;
      var x = bb.x0 + Math.sin(t * 0.8 + bb.phase + y * 0.01) * bb.wobble;
      ctx.beginPath();
      ctx.arc(x, y, bb.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // one drifting sine silhouette filled to the top edge
  function drawWave(ctx, t, baseY, amp, speed, wavelenDiv, fill) {
    var steps = 32;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (var i = 0; i <= steps; i++) {
      var x = (i / steps) * W;
      var y = baseY
        + Math.sin(x / wavelenDiv * 0.35 + t * speed) * amp
        + Math.sin(x / wavelenDiv * 0.17 - t * speed * 0.6) * amp * 0.5;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, 0);
    ctx.closePath();
    ctx.fill();
  }

  window.WaterLayer = {
    init: function (w, h) { build(w, h); },
    resize: function (w, h) { build(w, h); },
    drawBackground: drawBackground,
    drawOverlay: drawOverlay
  };
})();

    shark.x += shark.vx * dt;
    shark.y = shark.baseY + Math.sin(t * 0.5 + shark.bob) * 18;
    if ((shark.face === 1 && shark.x > W + shark.len) ||
        (shark.face === -1 && shark.x < -shark.len)) {
      shark.state = 'away';
      shark.timer = 5 + rng() * 7;
    }
  }

  function drawShark(ctx, t) {
    if (!shark || shark.state !== 'cross') return;
    var img = window.SHARK_IMG;
    if (!img || !img.complete || !img.naturalWidth) return;
    ctx.save();
    ctx.translate(shark.x, shark.y);
    ctx.rotate(Math.cos(t * 0.5 + shark.bob) * 0.04);
    ctx.scale(-shark.face, 1); // artwork faces left; flip when swimming right
    ctx.drawImage(img, -shark.len / 2, -shark.len / 2, shark.len, shark.len);
    ctx.restore();
  }

  function buildFish() {
    fish.length = 0;
    // 2 big slow blue-grays
    for (var i = 0; i < 2; i++) fish.push(makeFish(SPECIES[0], 52 + rng() * 8, false));
    // 5 mid blue-grays
    for (i = 0; i < 5; i++) fish.push(makeFish(SPECIES[0], 30 + rng() * 12, false));
    // 2 clownfish
    for (i = 0; i < 2; i++) fish.push(makeFish(SPECIES[1], 26 + rng() * 8, false));
    // 2 red snappers
    for (i = 0; i < 2; i++) fish.push(makeFish(SPECIES[3], 34 + rng() * 10, false));
    // school of 6 tiny yellow tangs
    for (i = 0; i < 6; i++) fish.push(makeFish(SPECIES[2], 18 + rng() * 6, true));
    for (i = 0; i < fish.length; i++) scatter(fish[i]);
  }

  // ---------- behavior ----------
  function pickShelter(f) {
    if (shelters.length === 0) return false;
    var s = shelters[(rng() * shelters.length) | 0];
    if (!s) return false;
    f.tgtX = s.x; f.tgtY = clamp(s.y, 0.15 * H, 0.88 * H); f.tgtR = s.r;
    return true;
  }

  function pickOpenWater(f) {
    f.tgtX = W * (0.15 + rng() * 0.7);
    f.tgtY = H * (0.2 + rng() * 0.45);
    f.tgtR = 40;
  }

  function update(dt, t, pointer) {
    if (dt <= 0) return;
    var n = fish.length, i, j, f;
    updateShark(dt, t, pointer);
    var sharkHunting = shark && shark.state === 'cross';
    // gaze origin: shark's snout, a bit ahead of center
    var gazeX = sharkHunting ? shark.x + shark.face * shark.len * 0.25 : 0;
    var gazeY = sharkHunting ? shark.y : 0;

    // school centroid + mean velocity (for flocking)
    schoolCx = 0; schoolCy = 0; schoolVx = 0; schoolVy = 0; schoolN = 0;
    for (i = 0; i < n; i++) {
      f = fish[i];
      if (f.school) { schoolCx += f.x; schoolCy += f.y; schoolVx += f.vx; schoolVy += f.vy; schoolN++; }
    }
    if (schoolN > 0) { schoolCx /= schoolN; schoolCy /= schoolN; schoolVx /= schoolN; schoolVy /= schoolN; }

    var yMin = 0.15 * H, yMax = 0.88 * H, xMargin = 70;

    for (i = 0; i < n; i++) {
      f = fish[i];
      var ax = 0, ay = 0;
      var speed = Math.sqrt(f.vx * f.vx + f.vy * f.vy);

      // --- wander: smooth sine-noise heading drift ---
      var wa = Math.sin(t * f.w1 + f.s1) + 0.6 * Math.sin(t * f.w2 + f.s2);
      var ang = wa * 0.85 + Math.sin(t * 0.13 + f.s3) * 1.6;
      var dvx = Math.cos(ang) * f.cruise;
      var dvy = Math.sin(ang) * f.cruise * 0.35;
      ax += (dvx - f.vx) * 0.8;
      ay += (dvy - f.vy) * 0.8;

      // --- shelter visit state machine ---
      f.timer -= dt;
      if (f.state === CRUISE) {
        if (f.timer <= 0) {
          if (pickShelter(f)) { f.state = TRAVEL; f.timer = 20; }
          else f.timer = 6 + rng() * 9;
        }
      } else if (f.state === TRAVEL) {
        var tx = f.tgtX - f.x, ty = f.tgtY - f.y;
        var td = Math.sqrt(tx * tx + ty * ty) || 1;
        ax += (tx / td * f.maxSpeed - f.vx) * 1.4;
        ay += (ty / td * f.maxSpeed - f.vy) * 1.4;
        if (td < f.tgtR * 0.6 || f.timer <= 0) { f.state = LINGER; f.timer = 2 + rng() * 3; }
      } else if (f.state === LINGER) {
        // slow drift around shelter center
        var lx = f.tgtX - f.x, ly = f.tgtY - f.y;
        ax += lx * 0.5 - f.vx * 1.5;
        ay += ly * 0.5 - f.vy * 1.5;
        if (f.timer <= 0) { pickOpenWater(f); f.state = LEAVE; f.timer = 8; }
      } else { // LEAVE
        var ox = f.tgtX - f.x, oy = f.tgtY - f.y;
        var od = Math.sqrt(ox * ox + oy * oy) || 1;
        ax += (ox / od * f.cruise - f.vx) * 1.0;
        ay += (oy / od * f.cruise - f.vy) * 1.0;
        if (od < 50 || f.timer <= 0) { f.state = CRUISE; f.timer = 6 + rng() * 9; }
      }

      // --- soft screen bounds ---
      if (f.x < xMargin) ax += (xMargin - f.x) * 1.6;
      else if (f.x > W - xMargin) ax -= (f.x - (W - xMargin)) * 1.6;
      if (f.y < yMin) ay += (yMin - f.y) * 2.2;
      else if (f.y > yMax) ay -= (f.y - yMax) * 2.2;

      // --- mild separation ---
      for (j = 0; j < n; j++) {
        if (j === i) continue;
        var g = fish[j];
        var sx = f.x - g.x, sy = f.y - g.y;
        var sr = (f.len + g.len) * 0.55;
        var d2 = sx * sx + sy * sy;
        if (d2 < sr * sr && d2 > 0.01) {
          var d = Math.sqrt(d2);
          var push = (1 - d / sr) * 60;
          ax += sx / d * push;
          ay += sy / d * push;
        }
      }

      // --- school flocking (cohesion + alignment, loose) ---
      if (f.school && schoolN > 1) {
        ax += (schoolCx - f.x) * 0.25 + (schoolVx - f.vx) * 0.5;
        ay += (schoolCy - f.y) * 0.25 + (schoolVy - f.vy) * 0.5;
      }

      // --- pointer flee ---
      if (pointer && pointer.active) {
        var px = f.x - pointer.x, py = f.y - pointer.y;
        var pd2 = px * px + py * py;
        if (pd2 < FLEE_R * FLEE_R) {
          var pd = Math.sqrt(pd2) || 1;
          var prox = 1 - pd / FLEE_R;             // 0..1, stronger closer
          var force = (prox * prox * 900 + 150) * f.lazy;
          ax += px / pd * force;
          ay += py / pd * force;
          f.burst = Math.max(f.burst, Math.min(1, prox * 1.6) * f.lazy);
          // startled fish abort coral visits
          if (f.state !== CRUISE) { f.state = CRUISE; f.timer = 6 + rng() * 9; }
        }
      }
      // --- shark gaze flee: fish in front of a hunting shark dart away ---
      if (sharkHunting) {
        var kx = f.x - gazeX, ky = f.y - gazeY;
        var kd2 = kx * kx + ky * ky;
        if (kd2 < SHARK_GAZE_R * SHARK_GAZE_R && kd2 > 1) {
          var kd = Math.sqrt(kd2);
          // inside the forward gaze cone — or anywhere near a dragged shark
          if (shark.dragging || (kx * shark.face) / kd > SHARK_CONE_COS) {
            var kprox = 1 - kd / SHARK_GAZE_R;
            // no laziness here — everyone fears the shark
            ax += kx / kd * (kprox * kprox * 1100 + 250);
            ay += ky / kd * (kprox * kprox * 1100 + 250);
            f.burst = Math.max(f.burst, Math.min(1, kprox * 1.8));
            if (f.state !== CRUISE) { f.state = CRUISE; f.timer = 6 + rng() * 9; }
          }
        }
      }
      // burst decays over ~1s
      if (f.burst > 0) f.burst = Math.max(0, f.burst - dt);

      // --- integrate with caps ---
      var mAcc = f.maxAccel * (1 + 2.5 * f.burst);
      var aMag = Math.sqrt(ax * ax + ay * ay);
      if (aMag > mAcc) { var as = mAcc / aMag; ax *= as; ay *= as; }
      f.vx += ax * dt;
      f.vy += ay * dt;
      var mSpd = f.maxSpeed * (1 + 1.7 * f.burst);
      if (f.state === LINGER && f.burst === 0) mSpd = f.maxSpeed * 0.25;
      var v = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
      if (v > mSpd) { var vs = mSpd / v; f.vx *= vs; f.vy *= vs; v = mSpd; }
      f.x += f.vx * dt;
      f.y += f.vy * dt;

      // facing (hysteresis so it doesn't flip-flop)
      if (f.vx > 4) f.face = 1;
      else if (f.vx < -4) f.face = -1;

      // tail wag phase: speed-proportional frequency, dt-scaled
      f.wagPhase += dt * (2.5 + v * 0.16 + f.burst * 6);
    }
  }

  // ---------- rendering ----------
  function drawFish(ctx, f, t) {
    var L = f.len;
    var hw = L * 0.5;
    var bh = L * f.bodyRatio;      // body height
    var hh = bh * 0.5;
    var bob = Math.sin(t * 1.4 + f.bobPhase) * L * 0.035;
    var tilt = clamp(Math.atan2(f.vy, Math.abs(f.vx) + 1) * 0.6, -0.35, 0.35);
    var wag = Math.sin(f.wagPhase) * (0.28 + f.burst * 0.2);

    ctx.save();
    ctx.translate(f.x, f.y + bob);
    ctx.scale(f.face, 1);
    ctx.rotate(tilt);

    // tail (caudal fin) — flexes around the body's rear attachment point
    var tX = -hw * 0.82;
    ctx.save();
    ctx.translate(tX, 0);
    ctx.rotate(wag * 0.55);
    var ts = f.tailSize;
    ctx.fillStyle = f.sp.fin;
    ctx.beginPath();
    ctx.moveTo(hw * 0.12, 0);
    ctx.lineTo(-hw * 0.52 * ts, -hh * 0.95 * ts);
    ctx.quadraticCurveTo(-hw * 0.3 * ts, 0, -hw * 0.52 * ts, hh * 0.95 * ts);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // dorsal fin (under body so the joint is hidden)
    ctx.fillStyle = f.sp.fin;
    ctx.beginPath();
    ctx.moveTo(hw * 0.05, -hh * 0.5);
    ctx.lineTo(-hw * 0.28, -hh - L * 0.16);
    ctx.quadraticCurveTo(-hw * 0.45, -hh * 0.7, -hw * 0.55, -hh * 0.3);
    ctx.closePath();
    ctx.fill();

    // body: rounded chunky ellipse, 2-tone cel shade via clip
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, hw, hh, 0, 0, TAU);
    ctx.clip();
    ctx.fillStyle = f.sp.back;                       // darker back
    ctx.fillRect(-hw, -hh, L, bh);
    ctx.fillStyle = f.sp.belly;                      // lighter belly
    ctx.beginPath();
    ctx.ellipse(hw * 0.08, hh * 0.62, hw * 0.98, hh * 0.85, 0, 0, TAU);
    ctx.fill();
    if (f.sp.stripe) {                               // clownfish band
      ctx.fillStyle = f.sp.stripe;
      ctx.fillRect(-hw * 0.05, -hh, hw * 0.22, bh);
      ctx.fillRect(hw * 0.5, -hh, hw * 0.18, bh);
    }
    ctx.restore();

    // pectoral fin, wags gently
    ctx.save();
    ctx.translate(hw * 0.02, hh * 0.25);
    ctx.rotate(0.5 + wag * 0.3);
    ctx.fillStyle = f.sp.fin;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-L * 0.22, L * 0.09);
    ctx.quadraticCurveTo(-L * 0.14, -L * 0.02, 0, -L * 0.05);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // eye: big white circle, large pupil, tiny highlight
    var ex = hw * 0.52, ey = -hh * 0.22, er = L * 0.115;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ex, ey, er, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#1c2730';
    ctx.beginPath();
    ctx.arc(ex + er * 0.18, ey, er * 0.58, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ex + er * 0.02, ey - er * 0.28, er * 0.18, 0, TAU);
    ctx.fill();

    // friendly upturned smile
    ctx.strokeStyle = '#1c2730';
    ctx.lineWidth = Math.max(1.2, L * 0.04);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(hw * 0.62, hh * 0.05, L * 0.13, Math.PI * 0.2, Math.PI * 0.75);
    ctx.stroke();

    ctx.restore();
  }

  function draw(ctx, t) {
    for (var i = 0; i < fish.length; i++) drawFish(ctx, fish[i], t);
    drawShark(ctx, t);
  }

  // ---------- lifecycle ----------
  function init(w, h, sh) {
    W = w; H = h;
    shelters = sh || [];
    rng = mulberry32(((window.SCENE_SEED >>> 0) ^ 0xF15C) >>> 0 || 0xF15C);
    buildFish();
    shark = makeShark();
  }

  function resize(w, h, sh) {
    W = w; H = h;
    shelters = sh || [];
    if (shark && shark.state === 'cross') shark.baseY = clamp(shark.baseY, 0.2 * H, 0.6 * H);
    for (var i = 0; i < fish.length; i++) {
      var f = fish[i];
      f.x = clamp(f.x, 10, W - 10);
      f.y = clamp(f.y, 0.15 * H, 0.88 * H);
      if (f.state === TRAVEL || f.state === LEAVE || f.state === LINGER) {
        // old targets may be off-screen / stale after regen
        f.state = CRUISE;
        f.timer = 3 + rng() * 8;
      }
    }
  }

  return { init: init, resize: resize, update: update, draw: draw, sharkCursor: sharkCursor };
})();
// Main harness — composes WaterLayer, CoralLayer, FishLayer per CONTRACT.md
(() => {
  window.SHARK_IMG = document.getElementById('shark-img');
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  const pointer = { x: -9999, y: -9999, active: false, down: false };

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const SEED_KEY = 'underwater-scene-seed';
  let stored = null;
  try { stored = localStorage.getItem(SEED_KEY); } catch (e) {}
  window.SCENE_SEED = stored !== null ? (Number(stored) >>> 0) : newSeed();

  function newSeed() {
    const s = (Math.random() * 0xffffffff) >>> 0;
    try { localStorage.setItem(SEED_KEY, String(s)); } catch (e) {}
    return s;
  }

  function buildScene() {
    WaterLayer.init(W, H);
    CoralLayer.init(W, H);
    FishLayer.init(W, H, CoralLayer.shelters);
  }

  size();
  buildScene();

  document.getElementById('reset').addEventListener('click', () => {
    window.SCENE_SEED = newSeed();
    buildScene();
  });

  window.addEventListener('resize', () => {
    size();
    WaterLayer.resize(W, H);
    CoralLayer.resize(W, H);
    FishLayer.resize(W, H, CoralLayer.shelters);
  });

  const setPtr = (x, y, active) => { pointer.x = x; pointer.y = y; pointer.active = active; };
  window.addEventListener('pointermove', e => setPtr(e.clientX, e.clientY, true));
  window.addEventListener('pointerdown', e => { setPtr(e.clientX, e.clientY, true); pointer.down = true; });
  window.addEventListener('pointerup', () => { pointer.active = false; pointer.down = false; });
  window.addEventListener('pointercancel', () => { pointer.active = false; pointer.down = false; });
  window.addEventListener('pointerleave', () => { setPtr(-9999, -9999, false); pointer.down = false; });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0]; if (t) { setPtr(t.clientX, t.clientY, true); pointer.down = true; }
  }, { passive: true });
  window.addEventListener('touchend', () => { setPtr(-9999, -9999, false); pointer.down = false; });

  let last = performance.now();
  function frame(now) {
    const t = now / 1000;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    WaterLayer.drawBackground(ctx, t);
    CoralLayer.drawBack(ctx, t);
    FishLayer.update(dt, t, pointer);
    FishLayer.draw(ctx, t);
    CoralLayer.drawFront(ctx, t);
    WaterLayer.drawOverlay(ctx, t);
    if (FishLayer.sharkCursor) canvas.style.cursor = FishLayer.sharkCursor(pointer.x, pointer.y);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
