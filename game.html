<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sub Cleanup</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #27455c; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    display: flex; gap: 18px; align-items: center;
    font: 700 19px/1 -apple-system, "Segoe UI", sans-serif;
    color: #eaf4f9; text-shadow: 0 1px 3px rgba(0,0,0,.45);
    pointer-events: none;
  }
  #hearts { color: #ff6b81; letter-spacing: 2px; font-size: 21px; }
  #hearts .lost { color: rgba(255,255,255,.25); }
  #stage {
    padding: 5px 14px; border-radius: 999px; font-size: 13px;
    background: rgba(255,255,255,.16); backdrop-filter: blur(6px);
    pointer-events: auto; cursor: pointer; transition: background .15s;
  }
  #stage:hover { background: rgba(255,255,255,.3); }
  #reset {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    padding: 9px 18px; border: none; border-radius: 999px;
    font: 600 14px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em;
    color: #eaf4f9; background: rgba(255,255,255,.16); backdrop-filter: blur(6px);
    cursor: pointer; transition: background .15s, transform .1s;
  }
  #reset:hover { background: rgba(255,255,255,.28); }
  #reset:active { transform: scale(.95); }
  #mute {
    position: fixed; top: 14px; right: 152px; z-index: 10;
    width: 36px; padding: 8px 0; border: none; border-radius: 999px;
    font: 600 14px/1 -apple-system, "Segoe UI", sans-serif; text-align: center;
    color: #eaf4f9; background: rgba(255,255,255,.16); backdrop-filter: blur(6px);
    cursor: pointer; transition: background .15s, transform .1s;
  }
  #mute:hover { background: rgba(255,255,255,.28); }
  #mute:active { transform: scale(.95); }
  #hint {
    position: fixed; bottom: 18px; left: 0; width: 100%; text-align: center; z-index: 10;
    padding: 0 14px; box-sizing: border-box;
    font: 600 14px/1.5 -apple-system, "Segoe UI", sans-serif;
    color: rgba(234,244,249,.85); text-shadow: 0 1px 3px rgba(0,0,0,.45);
    pointer-events: none; transition: opacity 1.2s;
  }
  #hint .short { display: none; }
  @media (max-width: 620px) {
    #hint .long { display: none; }
    #hint .short { display: inline; }
  }
  #over {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(10,25,35,.55);
  }
  #over.show { display: flex; }
  #over-box {
    background: rgba(255,255,255,.13); backdrop-filter: blur(10px);
    border-radius: 22px; padding: 34px 52px; text-align: center;
    color: #eaf4f9; font-family: -apple-system, "Segoe UI", sans-serif;
  }
  #over-box h1 { margin: 0 0 8px; font-size: 30px; }
  #over-box p { margin: 0 0 22px; font-size: 17px; opacity: .9; }
  #again {
    padding: 11px 26px; border: none; border-radius: 999px;
    font: 600 15px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em;
    color: #eaf4f9; background: rgba(255,255,255,.2); backdrop-filter: blur(6px);
    cursor: pointer; transition: background .15s, transform .1s;
  }
  #again:hover { background: rgba(255,255,255,.32); }
  #again:active { transform: scale(.95); }
  #showBadges {
    margin-left: 10px; padding: 11px 26px; border: none; border-radius: 999px;
    font: 600 15px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em;
    color: #eaf4f9; background: rgba(255,255,255,.2); backdrop-filter: blur(6px);
    cursor: pointer; transition: background .15s, transform .1s;
  }
  #showBadges:hover { background: rgba(255,255,255,.32); }
  #toast {
    position: fixed; right: 16px; bottom: 16px; z-index: 40;
    padding: 12px 20px; border-radius: 14px; max-width: 320px;
    font: 600 14px/1.4 -apple-system, "Segoe UI", sans-serif;
    color: #eaf4f9; background: rgba(255,255,255,.16); backdrop-filter: blur(8px);
    pointer-events: none; opacity: 0; transform: translateY(12px);
    transition: opacity .3s, transform .3s;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #badges {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; background: rgba(10,25,35,.6);
  }
  #badges.show { display: flex; }
  #badges-box {
    background: rgba(30,55,72,.92); backdrop-filter: blur(10px);
    border-radius: 22px; padding: 26px 30px; width: min(480px, 92vw);
    color: #eaf4f9; font-family: -apple-system, "Segoe UI", sans-serif;
  }
  #badges-box h2 { margin: 0 0 14px; font-size: 22px; }
  #badge-list { max-height: 58vh; overflow-y: auto; padding-right: 6px; }
  .badge {
    padding: 10px 12px; border-radius: 12px; margin-bottom: 8px;
    background: rgba(255,255,255,.1);
  }
  .badge.locked { opacity: .45; }
  .badge .bname { font-weight: 700; font-size: 15px; }
  .badge .bdesc { font-size: 13px; opacity: .85; margin-top: 2px; }
  .badge .btime { font-size: 12px; color: #9ed6f7; margin-top: 3px; }
  #badgesClose {
    margin-top: 14px; padding: 10px 24px; border: none; border-radius: 999px;
    font: 600 14px/1 -apple-system, "Segoe UI", sans-serif;
    color: #eaf4f9; background: rgba(255,255,255,.2); cursor: pointer;
  }
  #badgesClose:hover { background: rgba(255,255,255,.32); }
</style>
</head>

<canvas id="scene"></canvas>
<div id="hud"><span id="hearts"></span><span id="score">&#128465; 0</span><span id="stage" title="Click to switch stage">Day</span></div>
<button id="reset" title="Regenerate the reef with a new seed">&#8635; New reef</button>
<button id="mute" title="Toggle ambient sound">&#128263;</button>
<div id="hint"><span class="long">&#8592; &#8594; move &nbsp;&middot;&nbsp; space = up &nbsp;&middot;&nbsp; &#8595; = dive &nbsp;(touch: swipe to steer, tap = up)&nbsp;&middot;&nbsp; catch the sinking trash &mdash; grab plastic bags before the turtle eats them! Avoid fish (&minus;1&#9829;) and the shark (&minus;5&#9829;)</span><span class="short">swipe to steer &middot; tap = up &middot; catch trash, save the bags, dodge fish &amp; shark</span></div>
<div id="over"><div id="over-box"><h1>Game over</h1><p id="final"></p><button id="again">&#8635; Play again</button><button id="showBadges">&#127942; Achievements</button></div></div>
<div id="toast"></div>
<div id="badges"><div id="badges-box"><h2>&#127942; Achievements</h2><div id="badge-list"></div><button id="badgesClose">Close</button></div></div>

<script>
// WATER layer — background (gradient, god rays, sand, caustics) + overlay (surface waves, bubbles)

  // ---- seeded RNG (mulberry32) ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {

  var cells = [];         // caustic cells {cx, cy, r, phx, phy, f1, f2}

  var DUNE_STEPS = 64;

    var rnd = mulberry32((window.SCENE_SEED >>> 0) || 1337);

      var u = i / DUNE_STEPS;

        + Math.sin(u * Math.PI * 2 * 1.3 + p1) * 0.014 * h
        + Math.sin(u * Math.PI * 2 * 2.7 + p2) * 0.008 * h
        + Math.sin(u * Math.PI * 2 * 4.1 + p3) * 0.004 * h;
      duneXs.push(x); duneYs.push(y);

    rays.length = 0;
    var nRays = 4;

    // ---- pebbles ----
    pebbles.length = 0;
    for (var pb = 0; pb < 7; pb++) {

        y: (0.84 + rnd() * 0.13) * h,

        speed: 14 + rnd() * 18,       // px/s upward

    }
  }

  // lure/glow origin of a creature
  function glowPos(g) {
    if (g.kind === 'angler') return { x: g.x + g.face * 26, y: g.y - 16 };
    return { x: g.x, y: g.y };
  }

  function drawGlowers(ctx, t) {
    for (var i = 0; i < glowers.length; i++) {
      var g = glowers[i];
      var pulse = 0.85 + 0.15 * Math.sin(t * 2 + g.ph);
      ctx.save();
      ctx.translate(g.x, g.y);
      if (g.kind === 'jelly') {
        var squish = 1 + 0.1 * Math.sin(g.ph * 2);
        ctx.fillStyle = 'rgba(127,224,255,' + (0.55 * pulse).toFixed(3) + ')';
        ctx.beginPath();
        ctx.ellipse(0, 0, 20 * squish, 16 / squish, 0, Math.PI, TAU);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(127,224,255,' + (0.4 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 2;
        for (var j = -1; j <= 1; j++) {
          ctx.beginPath();
          ctx.moveTo(j * 9, 2);
          ctx.quadraticCurveTo(j * 9 + Math.sin(g.ph * 3 + j) * 6, 16, j * 9 + Math.sin(g.ph * 3 + j + 1) * 8, 30);
          ctx.stroke();
        }
      } else if (g.kind === 'octo') {
        ctx.scale(g.face, 1);
        ctx.fillStyle = 'rgba(197,139,255,' + (0.6 * pulse).toFixed(3) + ')';
        ctx.beginPath();
        ctx.ellipse(0, -4, 16, 18, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(197,139,255,' + (0.5 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for (var a = 0; a < 4; a++) {
          var off = (a - 1.5) * 8;
          ctx.beginPath();
          ctx.moveTo(off, 10);
          ctx.quadraticCurveTo(off + Math.sin(g.ph * 2.4 + a) * 8, 22, off + Math.sin(g.ph * 2.4 + a + 1.3) * 10, 32);
          ctx.stroke();
        }
        ctx.fillStyle = '#1c2730';
        ctx.beginPath(); ctx.arc(6, -8, 2.6, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(-4, -8, 2.6, 0, TAU); ctx.fill();
      } else { // anglerfish: dark body, pale teeth, glowing lure
        ctx.scale(g.face, 1);
        ctx.fillStyle = '#24343f';
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 15, 0, 0, TAU);
        ctx.fill();
        ctx.beginPath();                       // tail
        ctx.moveTo(-20, 0); ctx.lineTo(-34, -10); ctx.lineTo(-34, 10);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#f5ead9';             // jagged teeth
        for (var th = 0; th < 4; th++) {
          ctx.beginPath();
          ctx.moveTo(8 + th * 4, 6); ctx.lineTo(10 + th * 4, 11); ctx.lineTo(12 + th * 4, 6);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#e8f6ff';             // eye
        ctx.beginPath(); ctx.arc(8, -5, 4, 0, TAU); ctx.fill();
        ctx.fillStyle = '#1c2730';
        ctx.beginPath(); ctx.arc(9, -5, 2, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#3a4f5e';           // lure stalk
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(4, -13);
        ctx.quadraticCurveTo(18, -30, 26, -16);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,217,122,' + (0.95 * pulse).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(26, -16, 5, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,240,190,0.9)';
        ctx.beginPath(); ctx.arc(26, -16, 2.2, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }

  /* ---------- damage ---------- */
  // penalty=true (stolen trash, eaten bag) bypasses the shield — the
  // bubble blocks impacts, not consequences — and never opens the gate.
  // `by` names the attacker for contact hits; while the night gate is
  // armed, contact descends (shielded contact pays the toll unharmed).
  function hurt(dmg, x, y, txt, penalty, by) {
    if (shield && !penalty) {
      shield = 0;
      popup(x, y, '🫧 shield!', '#9ed6f7');
      if (armed && stage === 2 && by) descend(by, true);
      return;
    }
    hp -= dmg;
    heartsLost += dmg;
    popup(x, y, txt || ('−' + dmg), '#ff6b81');
    if (hp <= 0) { hp = 0; over = true; return; }   // death beats descent
    if (armed && stage === 2 && !penalty && by) descend(by, false);
  }

  function checkCollisions(fishLayer) {
    if (invuln > 0) return;
    var fs = fishLayer.fishList();
    for (var i = 0; i < fs.length; i++) {
      var f = fs[i];
      var dx = f.x - sub.x, dy = f.y - sub.y;
      var r = f.len * 0.5 + SUB_R * 0.8;
      if (dx * dx + dy * dy < r * r) {
        hurt(1, sub.x, sub.y - 40, null, false, 'fish');
        invuln = 1.3;
        f.burst = 1; // startle the fish away
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        f.vx += dx / d * 160; f.vy += dy / d * 160;
        return;
      }
    }
    // turtle pinch
    if (turtle) {
      var tx = turtle.x - sub.x, ty = turtle.y - sub.y;
      var trr = 34 + SUB_R * 0.8;
      if (tx * tx + ty * ty < trr * trr) {
        hurt(1, sub.x, sub.y - 40, '🐢 −1', false, 'turtle');
        invuln = 1.3;
        return;
      }
    }
    // crab pinch — but tackling a loaded crab wins its loot back
    for (var c = 0; c < crabs.length; c++) {
      var cx = crabs[c].x - sub.x, cy = crabs[c].y - sub.y;
      var cr = 24 + SUB_R * 0.8;
      if (cx * cx + cy * cy < cr * cr) {
        if (crabs[c].carrying) {
          var loot = crabs[c].carrying.kind;
          crabs[c].carrying = null;
          scoreTrash(crabs[c].x, crabs[c].y - 44, loot);
          recCrab();
        }
        hurt(1, sub.x, sub.y - 40, '🦀 −1', false, 'crab');
        invuln = 1.3;
        return;
      }
    }
    // abyss glow creatures sting hard
    if (stage === 3) {
      for (var g = 0; g < glowers.length; g++) {
        var gl = glowers[g];
        var gx = gl.x - sub.x, gy = gl.y - sub.y;
        var gr = (gl.kind === 'angler' ? 28 : 22) + SUB_R * 0.8;
        if (gx * gx + gy * gy < gr * gr) {
          hurt(2, sub.x, sub.y - 40);
          invuln = 1.6;
          return;
        }
      }
    }
    var sh = fishLayer.getShark();
    if (sh && sh.state === 'cross') {
      var sx = sh.x - sub.x, sy = sh.y - sub.y;
      var sr = sh.len * 0.36 + SUB_R * 0.8;
      if (sx * sx + sy * sy < sr * sr) {
        if (shield) {                       // revenge of the overachiever
          shield = 0;
          popup(sub.x, sub.y - 40, '🫧 shield!', '#9ed6f7');
          popup(sh.x, sh.y - sh.len * 0.35, '💫 revenge!', '#e8c547');
          fishLayer.koShark();
          recKO();                          // KO credits the CURRENT stage
          invuln = 1.3;
          if (armed && stage === 2) descend('shark', true);
        } else {
          hurt(5, sub.x, sub.y - 40, '−5 shark!', false, 'shark');
          invuln = 2.2;
        }
      }
    }
  }

  /* ---------- update ---------- */
  function update(dt, t, fishLayer) {
    if (over) return;

    // sub physics: neutral buoyancy + gentle downward sediment current;
    // left/right thrust, space = up, down arrow = dive
    var ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    sub.vx += ax * 320 * dt;
    sub.vx *= Math.pow(0.22, dt);
    if (upImpulse) { sub.vy -= 120; upImpulse = false; }
    if (keys.up) sub.vy -= 170 * dt;
    if (keys.down) sub.vy += 170 * dt;
    sub.vy += stageCur() * 2 * dt;   // the drift from top to bottom
    sub.vy *= Math.pow(0.4, dt);
    sub.vx = clamp(sub.vx, -240, 240);
    sub.vy = clamp(sub.vy, -240, 160);
    sub.x = clamp(sub.x + sub.vx * dt, 44, W - 44);
    sub.y += sub.vy * dt;
    var yMin = 0.09 * H, yMax = 0.86 * H;
    if (sub.y < yMin) { sub.y = yMin; if (sub.vy < 0) sub.vy = 0; }
    if (sub.y > yMax) { sub.y = yMax; if (sub.vy > 0) sub.vy = 0; }
    if (ax > 0) sub.face = 1; else if (ax < 0) sub.face = -1;
    sub.prop += dt * (7 + Math.abs(sub.vx) * 0.06);

    if (keys.up && Math.random() < dt * 18) {
      thrustBubbles.push({ x: sub.x + (Math.random() - 0.5) * 24, y: sub.y + 22, r: 1.5 + Math.random() * 2.5, age: 0 });
    }
    for (var b = thrustBubbles.length - 1; b >= 0; b--) {
      var bb = thrustBubbles[b];
      bb.age += dt; bb.y -= 55 * dt;
      if (bb.age > 1.1) thrustBubbles.splice(b, 1);
    }

    // marine snow drifts down with the current, wraps back to the top
    var cur = stageCur();
    for (var s = 0; s < sediment.length; s++) {
      var sp = sediment[s];
      sp.y += (sp.s + cur) * dt;
      sp.x += Math.sin(t * 0.5 + sp.ph) * 7 * dt;
      if (sp.y > H + 4) { sp.y = -4; sp.x = Math.random() * W; }
    }

    // night: krill spawn around the sub and stay where they are — the sub
    // shoulders through them and leaves a fading, glowing trail behind
    var spd = Math.sqrt(sub.vx * sub.vx + sub.vy * sub.vy);
    // glow elongates toward where you're swimming, relaxes when you slow down
    if (spd > 30) glowAng = Math.atan2(sub.vy, sub.vx);
    glowStretch += (clamp(spd / 240, 0, 1) * 0.9 - glowStretch) * Math.min(1, dt * 3);
    // headlight swivels the same way (nose-local tilt toward the heading)
    var tgtBeam = clamp(Math.atan2(sub.vy, Math.max(sub.vx * sub.face, 40)), -1.1, 1.1);
    beamAng += (tgtBeam - beamAng) * Math.min(1, dt * 4);
    if (stage === 2) {
      charge = clamp(charge + (spd > 55 ? dt * 0.9 : -dt * 0.45), 0, 1);
      krillT -= dt;
      while (krillT <= 0 && krill.length < 90) {
        krillT += 0.07;
        var ka = Math.random() * TAU, kr2 = 12 + Math.random() * 38;
        krill.push({
          x: sub.x + Math.cos(ka) * kr2 * 1.3,
          y: sub.y + Math.sin(ka) * kr2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 10 - 3,
          r: 1.2 + Math.random() * 1.8,
          age: 0, life: 2.4 + Math.random() * 1.2
        });
      }
    }
    for (var k = krill.length - 1; k >= 0; k--) {
      var kr = krill[k];
      kr.age += dt;
      if (kr.age > kr.life) { krill.splice(k, 1); continue; }
      // the passing sub pushes krill out of its way
      var kdx = kr.x - sub.x, kdy = kr.y - sub.y;
      var kd2 = kdx * kdx + kdy * kdy;
      if (kd2 < 55 * 55 && kd2 > 1) {
        var kd = Math.sqrt(kd2);
        var kf = (1 - kd / 55) * (50 + spd * 0.9);
        kr.vx += kdx / kd * kf * dt;
        kr.vy += kdy / kd * kf * dt;
      }
      kr.vx *= Math.pow(0.5, dt);
      kr.vy *= Math.pow(0.5, dt);
      kr.x += kr.vx * dt;
      kr.y += kr.vy * dt;
    }

    updateGlowers(dt, t);

    if (invuln > 0) invuln -= dt;
    updateTrash(dt, t);
    updateTurtle(dt, t);
    updateCrabs(dt, t);
    checkCollisions(fishLayer);

    for (var p = popups.length - 1; p >= 0; p--) {
      popups[p].age += dt;
      if (popups[p].age > 1.2) popups.splice(p, 1);
    }
  }

  /* ---------- drawing ---------- */
  function drawBottle(ctx, cap, label) {
    ctx.fillStyle = 'rgba(175,220,240,0.8)';
    ctx.beginPath();
    ctx.moveTo(-7, -10);
    ctx.quadraticCurveTo(-8, -16, -3, -17);
    ctx.lineTo(3, -17);
    ctx.quadraticCurveTo(8, -16, 7, -10);
    ctx.lineTo(7, 15);
    ctx.quadraticCurveTo(7, 18, 4, 18);
    ctx.lineTo(-4, 18);
    ctx.quadraticCurveTo(-7, 18, -7, 15);
    ctx.closePath();
    ctx.fill();
    if (cap !== null) {                             // cap (may have been lost at sea)
      ctx.fillStyle = cap || BOTTLE_CAPS[0];
      ctx.fillRect(-4, -22, 8, 6);
    } else {                                        // open neck ring instead
      ctx.strokeStyle = 'rgba(175,220,240,0.9)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(0, -16.5, 3.2, 1.4, 0, 0, TAU);
      ctx.stroke();
    }
    if (label !== null) {                           // label (may be missing)
      ctx.fillStyle = label || BOTTLE_LABELS[0];
      ctx.fillRect(-7, 0, 14, 9);
    }
  }

  function drawBag(ctx, t, tint) {
    var col = tint || 'rgba(240,246,250,0.82)';
    var wob = Math.sin(t * 2.1) * 2;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-13, -8);
    ctx.quadraticCurveTo(-16 + wob, 6, -10, 15);
    ctx.quadraticCurveTo(0, 20 - wob, 10, 14);
    ctx.quadraticCurveTo(17 - wob, 5, 13, -8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = col;                          // handles
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(-7, -10, 5, Math.PI, 0);
    ctx.arc(7, -10, 5, Math.PI, 0);
    ctx.stroke();
  }

  function drawPylon(ctx) {
    ctx.fillStyle = '#f07f2e';
    ctx.beginPath();
    ctx.moveTo(-4, -20);
    ctx.lineTo(4, -20);
    ctx.lineTo(11, 14);
    ctx.lineTo(-11, 14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f5ead9';                      // stripe
    ctx.beginPath();
    ctx.moveTo(-6.5, -8);
    ctx.lineTo(6.5, -8);
    ctx.lineTo(8.2, 0);
    ctx.lineTo(-8.2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d96a1e';                      // base
    ctx.fillRect(-14, 14, 28, 5);
  }

  function drawDuck(ctx) {
    ctx.fillStyle = '#f7d21e';                      // body
    ctx.beginPath();
    ctx.ellipse(0, 4, 14, 10, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();                                // head
    ctx.arc(8, -8, 8, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#e0b414';                      // wing
    ctx.beginPath();
    ctx.ellipse(-3, 4, 7, 5, -0.3, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#f07f2e';                      // beak
    ctx.beginPath();
    ctx.moveTo(14, -11);
    ctx.quadraticCurveTo(24, -8, 14, -5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1c2730';                      // eye
    ctx.beginPath();
    ctx.arc(10, -10, 1.9, 0, TAU);
    ctx.fill();
  }

  function drawBoot(ctx, col) {
    col = col || BOOT_COLS[0];
    ctx.fillStyle = col.main;                       // shaft + foot
    ctx.beginPath();
    ctx.moveTo(-9, -20);
    ctx.lineTo(5, -20);
    ctx.lineTo(5, 2);
    ctx.quadraticCurveTo(15, 2, 16, 9);
    ctx.lineTo(16, 13);
    ctx.lineTo(-9, 13);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f5ead9';                      // rim
    ctx.fillRect(-9, -20, 14, 4);
    ctx.fillStyle = col.sole;                       // sole
    ctx.beginPath();
    ctx.moveTo(-10, 11);
    ctx.lineTo(17, 11);
    ctx.quadraticCurveTo(18, 16, 14, 16);
    ctx.lineTo(-7, 16);
    ctx.quadraticCurveTo(-11, 16, -10, 11);
    ctx.closePath();
    ctx.fill();
  }

  // darken a hex color toward black by f (0..1)
  function darken(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgb(' + Math.round(((n >> 16) & 255) * (1 - f)) + ',' +
                    Math.round(((n >> 8) & 255) * (1 - f)) + ',' +
                    Math.round((n & 255) * (1 - f)) + ')';
  }

  function drawFlipFlop(ctx, sole, strap) {
    sole = sole || FLIP_COLS[0]; strap = strap || FLIP_COLS[1];
    ctx.save();
    ctx.rotate(0.5);                                // emoji-style diagonal pose
    ctx.fillStyle = darken(sole, 0.3);              // sole thickness (side edge)
    ctx.beginPath();
    ctx.ellipse(0, 2.5, 21, 8, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = sole;                           // sole top face
    ctx.beginPath();
    ctx.ellipse(0, -1, 21, 8, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = lighten(sole, 0.15);            // subtle deck highlight
    ctx.beginPath();
    ctx.ellipse(-1, -2, 17, 5.5, 0, 0, TAU);
    ctx.fill();
    // thong: two bands arcing up to a raised junction + post down to the toe
    ctx.strokeStyle = strap;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();                                // left band, heel side → junction
    ctx.moveTo(-9, -2);
    ctx.quadraticCurveTo(-2, -17, 6, -13);
    ctx.stroke();
    ctx.beginPath();                                // right band, junction → far side
    ctx.moveTo(6, -13);
    ctx.quadraticCurveTo(13, -12, 14, -2);
    ctx.stroke();
    ctx.beginPath();                                // toe post, junction → sole
    ctx.moveTo(6, -13);
    ctx.quadraticCurveTo(8, -8, 9, -1);
    ctx.stroke();
    ctx.restore();
  }

  function drawCan(ctx) {
    ctx.fillStyle = '#bf3441';                      // red label, upper half
    ctx.fillRect(-9, -10, 18, 10);
    ctx.fillStyle = '#f5ead9';                      // beige label, lower half
    ctx.fillRect(-9, 0, 18, 9);
    ctx.fillStyle = '#e8c547';                      // medallion, no text
    ctx.beginPath();
    ctx.arc(0, 0, 2.6, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#b9c2c8';                      // silver ribs
    ctx.beginPath();
    ctx.ellipse(0, -10, 9, 2.8, 0, 0, TAU);
    ctx.fill();
    ctx.fillRect(-9, 9, 18, 2.5);
    ctx.beginPath();
    ctx.ellipse(0, 11.5, 9, 2.2, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#8e979d';                    // top rim line
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, -10, 9, 2.8, 0, 0, TAU);
    ctx.stroke();
  }

  function drawCup(ctx, body, lid) {
    body = body || CUP_BODIES[0];
    if (lid === undefined) lid = CUP_LIDS[0];
    var clear = body === CUP_CLEAR;
    if (clear) ctx.globalAlpha = 0.72;
    ctx.fillStyle = body;                           // trapezoid body
    ctx.beginPath();
    ctx.moveTo(-9, -8);
    ctx.lineTo(9, -8);
    ctx.lineTo(6.5, 14);
    ctx.lineTo(-6.5, 14);
    ctx.closePath();
    ctx.fill();
    if (!clear) {                                   // sleeve band (paper cups only)
      ctx.fillStyle = darken(body, 0.18);
      ctx.beginPath();
      ctx.moveTo(-8.4, -3);
      ctx.lineTo(8.4, -3);
      ctx.lineTo(7.6, 4);
      ctx.lineTo(-7.6, 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (lid !== null) {                             // lid + sip lump
      ctx.fillStyle = lid;
      ctx.fillRect(-10.5, -12.5, 21, 4.5);
      ctx.fillRect(-4, -15.5, 8, 3);
      ctx.strokeStyle = darken(lid, 0.25);          // lid edge
      ctx.lineWidth = 1.2;
      ctx.strokeRect(-10.5, -12.5, 21, 4.5);
    } else {                                        // lidless: open rim
      ctx.fillStyle = darken(body, 0.45);
      ctx.beginPath();
      ctx.ellipse(0, -8, 9, 2.4, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = lighten(body, 0.25);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(0, -8, 9, 2.4, 0, 0, TAU);
      ctx.stroke();
    }
  }

  // blend two hex colors by f (0..1)
  function lerpCol(a, b, f) {
    var A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
    var r = Math.round(((A >> 16) & 255) + (((B >> 16) & 255) - ((A >> 16) & 255)) * f);
    var g = Math.round(((A >> 8) & 255) + (((B >> 8) & 255) - ((A >> 8) & 255)) * f);
    var bl = Math.round((A & 255) + ((B & 255) - (A & 255)) * f);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  function drawSlinky(ctx, colA, colB, t) {
    colA = colA || SLINKY_NEON[0]; colB = colB || SLINKY_NEON[2];
    var COILS = 6, RY = 12;
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    for (var i = 0; i < COILS; i++) {
      var f = i / (COILS - 1);
      // top and bottom sway at slightly different speeds, opposite ways — springy
      var topX = Math.sin(t * 1.7 + f * 2.2) * 2.2;
      var botX = Math.sin(t * 1.35 + f * 2.2 + Math.PI) * 2.2;
      ctx.save();
      ctx.translate(-13 + i * 5.2 + (topX + botX) / 2, Math.sin(f * Math.PI) * -3);
      ctx.transform(1, 0, (topX - botX) / (2 * RY), 1, 0, 0);   // skew top vs bottom
      ctx.strokeStyle = lerpCol(colA, colB, f);
      ctx.beginPath();
      ctx.ellipse(0, 0, 5.5, RY, -0.12, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawRings(ctx, t) {
    // six-pack rings: 3x2 interlocked circles, translucent light blue
    ctx.strokeStyle = 'rgba(175,220,240,0.85)';
    ctx.lineWidth = 2;
    var wob = Math.sin(t * 1.8) * 0.06;
    for (var row = 0; row < 2; row++) {
      for (var col = 0; col < 3; col++) {
        ctx.beginPath();
        ctx.ellipse((col - 1) * 9.6, (row - 0.5) * 9.6,
                    5.4, 5.4 * (1 - wob * (row ? 1 : -1)), 0, 0, TAU);
        ctx.stroke();
      }
    }
  }

  function drawTrashItem(ctx, tr, t) {
    ctx.save();
    ctx.translate(tr.x, tr.y);
    ctx.rotate(tr.rest && tr.kind === 'pylon' ? 0 : tr.rot);
    if (tr.kind === 'bottle') drawBottle(ctx, tr.capCol, tr.labelCol);
    else if (tr.kind === 'bag') drawBag(ctx, t + tr.swayPh, tr.tint);
    else if (tr.kind === 'duck') drawDuck(ctx);
    else if (tr.kind === 'boot') drawBoot(ctx, tr.bootCol);
    else if (tr.kind === 'flipflop') drawFlipFlop(ctx, tr.soleCol, tr.strapCol);
    else if (tr.kind === 'can') drawCan(ctx);
    else if (tr.kind === 'cup') drawCup(ctx, tr.cupBody, tr.cupLid);
    else if (tr.kind === 'slinky') drawSlinky(ctx, tr.slinkyA, tr.slinkyB, t + tr.swayPh);
    else if (tr.kind === 'rings') drawRings(ctx, t + tr.swayPh);
    else drawPylon(ctx);
    ctx.restore();
  }

  function drawTurtle(ctx, t) {
    if (!turtle) return;
    var flap = Math.sin(turtle.flap) * 0.5;
    ctx.save();
    ctx.translate(turtle.x, turtle.y);
    ctx.scale(turtle.face, 1);
    ctx.rotate(Math.sin(turtle.flap * 0.5) * 0.06 - (turtle.surfacing ? 0.4 : 0));
    // back flipper
    ctx.fillStyle = '#5e8a4f';
    ctx.save();
    ctx.translate(-20, 6);
    ctx.rotate(0.6 - flap * 0.6);
    ctx.beginPath();
    ctx.ellipse(0, 8, 6, 12, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    // shell
    ctx.fillStyle = '#6a9c58';
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 19, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#527a43';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 12, 0, 0, TAU);
    ctx.moveTo(-22, 0); ctx.lineTo(22, 0);
    ctx.moveTo(0, -12); ctx.lineTo(0, 12);
    ctx.stroke();
    // belly rim
    ctx.fillStyle = '#e8c547';
    ctx.beginPath();
    ctx.ellipse(0, 14, 26, 6, 0, 0, Math.PI);
    ctx.fill();
    // head
    ctx.fillStyle = '#7fb069';
    ctx.beginPath();
    ctx.ellipse(34, -4, 10, 8, 0, 0, TAU);
    ctx.fill();
    // eye
    ctx.fillStyle = '#1c2730';
    ctx.beginPath();
    ctx.arc(37, -6, 2.2, 0, TAU);
    ctx.fill();
    // front flipper
    ctx.fillStyle = '#7fb069';
    ctx.save();
    ctx.translate(10, 8);
    ctx.rotate(0.5 + flap);
    ctx.beginPath();
    ctx.ellipse(0, 10, 7, 14, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawSub(ctx, t) {
    if (invuln > 0 && Math.floor(t * 12) % 2 === 0) return; // hit flash
    ctx.save();
    ctx.translate(sub.x, sub.y);
    ctx.scale(sub.face, 1);
    ctx.rotate(clamp(sub.vy * 0.0012, -0.18, 0.18));

    // propeller (behind hull)
    ctx.save();
    ctx.translate(-46, 0);
    ctx.fillStyle = '#8e6f2a';
    var blade = Math.sin(sub.prop);
    ctx.beginPath();
    ctx.ellipse(0, 0, 4, 13 * Math.abs(blade) + 2, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // tail fin
    ctx.fillStyle = '#c9a63b';
    ctx.beginPath();
    ctx.moveTo(-30, -6);
    ctx.lineTo(-46, -18);
    ctx.lineTo(-40, 0);
    ctx.lineTo(-46, 18);
    ctx.lineTo(-30, 6);
    ctx.closePath();
    ctx.fill();

    // conning tower + periscope
    ctx.fillStyle = '#c9a63b';
    ctx.beginPath();
    ctx.moveTo(-12, -16);
    ctx.quadraticCurveTo(-12, -32, 0, -32);
    ctx.quadraticCurveTo(12, -32, 12, -16);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#c9a63b';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(4, -32);
    ctx.lineTo(4, -40);
    ctx.lineTo(12, -40);
    ctx.stroke();

    // hull, 2-tone cel like the fish
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, 44, 20, 0, 0, TAU);
    ctx.clip();
    ctx.fillStyle = '#e8c547';
    ctx.fillRect(-44, -20, 88, 40);
    ctx.fillStyle = '#c9a63b';
    ctx.beginPath();
    ctx.ellipse(0, 14, 42, 14, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // portholes
    for (var i = 0; i < 3; i++) {
      var px = -16 + i * 16;
      ctx.fillStyle = '#9ed6f7';
      ctx.beginPath();
      ctx.arc(px, -2, 5, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#8e6f2a';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // nose light
    ctx.fillStyle = '#f5ead9';
    ctx.beginPath();
    ctx.ellipse(42, 0, 5, 8, 0, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  /* ---------- darkness: night glow + abyss ---------- */
  var darkCv = null, darkCtx = null;

  // headlight cone: drawn in nose-local space, flipped with facing and
  // swiveled by beamAng so it points where the sub is swimming
  function coneTransform(c) {
    c.translate(sub.x + sub.face * 46, sub.y);
    c.scale(sub.face, 1);
    c.rotate(beamAng);
  }

  function conePathLocal(c, f) {
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(230, -78 * f);
    c.lineTo(230, 78 * f);
    c.closePath();
  }

  var CONE_FEATHER = [1, 0.72, 0.48];   // nested passes = soft blurred edge

  function punchHole(d, x, y, r, a) {
    var g = d.createRadialGradient(x, y, r * 0.15, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,' + a.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g;
    d.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // sub glow hole: shifted toward the swim direction and mildly elongated
  // along it; at rest it settles back to a centered circle
  function punchSubGlow(d, r, a) {
    d.save();
    d.translate(sub.x, sub.y);
    d.rotate(glowAng);
    d.translate(r * glowStretch * 0.5, 0);     // shift ahead of the sub
    d.scale(1 + glowStretch * 0.6, 1);         // mild stretch along the heading
    var g = d.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
    g.addColorStop(0, 'rgba(0,0,0,' + a.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g;
    d.fillRect(-r, -r, r * 2, r * 2);
    d.restore();
  }

  // cut the headlight cone out of the darkness (call in destination-out mode);
  // three feathered passes ≈ 40% of the old strength with a soft edge
  function punchCone(d) {
    d.save();
    coneTransform(d);
    var g = d.createLinearGradient(0, 0, 230, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g;
    for (var i = 0; i < CONE_FEATHER.length; i++) {
      conePathLocal(d, CONE_FEATHER[i]);
      d.fill();
    }
    d.restore();
  }

  function drawDark(ctx, t) {
    if (stage === 1) return;
    if (!darkCv) { darkCv = document.createElement('canvas'); darkCtx = darkCv.getContext('2d'); }
    if (darkCv.width !== W || darkCv.height !== H) { darkCv.width = W; darkCv.height = H; }
    var dark, shade;
    if (stage === 2) { dark = 0.88; shade = '2,10,22'; }
    else { // abyss: near-black water, and the deeper you go, the darker it gets
      var depth = clamp((sub.y - 0.09 * H) / (0.77 * H), 0, 1);
      dark = 0.78 + 0.2 * depth;
      shade = '1,5,12';
    }
    var d = darkCtx;
    d.globalCompositeOperation = 'source-over';
    d.clearRect(0, 0, W, H);
    d.fillStyle = 'rgba(' + shade + ',' + dark.toFixed(3) + ')';
    d.fillRect(0, 0, W, H);
    d.globalCompositeOperation = 'destination-out';
    if (stage === 2) {
      // moonlight: a faint band plus the god-ray shafts brighten the upper water
      var band = d.createLinearGradient(0, 0, 0, 0.3 * H);
      band.addColorStop(0, 'rgba(0,0,0,0.28)');
      band.addColorStop(1, 'rgba(0,0,0,0)');
      d.fillStyle = band;
      d.fillRect(0, 0, W, 0.3 * H);
      var rg = window.WaterLayer.rayGeom(t);
      var rayH = 0.45 * H;
      for (var ri = 0; ri < rg.length; ri++) {
        var ray = rg[ri];
        var botX = ray.topX + ray.slant * 0.53;   // ray x at 45% height
        var shaft = d.createLinearGradient(0, 0, 0, rayH);
        shaft.addColorStop(0, 'rgba(0,0,0,' + (0.4 * ray.pulse).toFixed(3) + ')');
        shaft.addColorStop(1, 'rgba(0,0,0,0)');
        d.fillStyle = shaft;
        d.beginPath();
        d.moveTo(ray.topX - ray.w * 0.5, 0);
        d.lineTo(ray.topX + ray.w * 0.5, 0);
        d.lineTo(botX + ray.w * 0.9, rayH);
        d.lineTo(botX - ray.w * 0.9, rayH);
        d.closePath();
        d.fill();
      }
      punchSubGlow(d, 110 + 160 * charge, 0.5 + 0.4 * charge);
      punchCone(d);
      for (var kp = 0; kp < krill.length; kp++) {
        var kk = krill[kp];
        var fade = 1 - kk.age / kk.life;
        punchHole(d, kk.x, kk.y, 50, 0.35 * fade);
      }
      // a couple of krill hitch a ride on trash in the upper water —
      // a faint glimpse of what's sinking toward you
      for (var tp = 0; tp < trash.length; tp++) {
        var tt = trash[tp];
        if (tt.y < 0.5 * H) punchHole(d, tt.x, tt.y, 42, 0.3);
      }
    } else {
      punchSubGlow(d, 90, 0.5);                  // faint instrument light
      punchCone(d);
      for (var i = 0; i < glowers.length; i++) {
        var g = glowers[i];
        var p = glowPos(g);
        var pulse = 1 + 0.12 * Math.sin(t * 2 + g.ph);
        punchHole(d, p.x, p.y, g.glowR * pulse, 0.92);
      }
      var ks = window.CoralLayer.kelpList();     // kelp sheds light through the dark
      for (var kk = 0; kk < ks.length; kk++) {
        punchHole(d, ks[kk].x, ks[kk].y - ks[kk].h * 0.55, ks[kk].h * 0.7, 0.55 * ks[kk].glowF);
      }
    }
    d.globalCompositeOperation = 'source-over';
    ctx.drawImage(darkCv, 0, 0);

    if (stage === 2) {   // krill dots, additive, fading out where they were left
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (var k = 0; k < krill.length; k++) {
        var kr = krill[k];
        var a = 0.65 * (1 - kr.age / kr.life);
        ctx.fillStyle = 'rgba(90,225,255,' + (a * 0.25).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(kr.x, kr.y, kr.r * 3, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(150,240,255,' + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(kr.x, kr.y, kr.r, 0, TAU); ctx.fill();
      }
      // two twinkling hitchhikers per upper-water trash item
      for (var tk = 0; tk < trash.length; tk++) {
        var th = trash[tk];
        if (th.y >= 0.5 * H) continue;
        for (var n = 0; n < 2; n++) {
          var tw = 0.35 + 0.3 * Math.sin(t * 3 + th.swayPh + n * 2.7);
          var hx = th.x + Math.sin(t * 1.8 + th.swayPh + n * 3.1) * 12;
          var hy = th.y + Math.cos(t * 1.5 + th.swayPh + n * 2.2) * 9;
          ctx.fillStyle = 'rgba(150,240,255,' + tw.toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(hx, hy, 1.6, 0, TAU); ctx.fill();
        }
      }
      ctx.restore();
    } else {
      drawGlowers(ctx, t);  // light emitters stay visible above the dark
    }
  }

  function drawBack(ctx, t) {
    // marine snow
    ctx.fillStyle = 'rgba(232,226,205,0.32)';
    for (var s = 0; s < sediment.length; s++) {
      var sp = sediment[s];
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.r, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(220,240,250,0.35)';
    for (var b = 0; b < thrustBubbles.length; b++) {
      var bb = thrustBubbles[b];
      ctx.globalAlpha = 1 - bb.age / 1.1;
      ctx.beginPath();
      ctx.arc(bb.x, bb.y, bb.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (var i = 0; i < trash.length; i++) drawTrashItem(ctx, trash[i], t);
    drawCrabs(ctx, t);
    drawTurtle(ctx, t);
  }

  function drawShield(ctx, t) {
    if (!shield) return;
    var wob = Math.sin(t * 2.6) * 2;
    ctx.strokeStyle = 'rgba(190,235,255,0.65)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(sub.x, sub.y - 4, 60 + wob, 48 - wob * 0.5, 0, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(190,235,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';    // shine
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sub.x - 18, sub.y - 22, 34, Math.PI * 1.1, Math.PI * 1.45);
    ctx.stroke();
  }

  function drawFront(ctx, t) {
    // headlight beam — faint feathered yellow cone from the nose, in every stage
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    coneTransform(ctx);
    var bg = ctx.createLinearGradient(0, 0, 230, 0);
    bg.addColorStop(0, 'rgba(255,238,160,0.045)');
    bg.addColorStop(1, 'rgba(255,238,160,0)');
    ctx.fillStyle = bg;
    for (var fi = 0; fi < CONE_FEATHER.length; fi++) {
      conePathLocal(ctx, CONE_FEATHER[fi]);
      ctx.fill();
    }
    ctx.restore();
    drawSub(ctx, t);
    drawShield(ctx, t);
    ctx.font = '700 17px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    for (var p = 0; p < popups.length; p++) {
      var pp = popups[p];
      ctx.globalAlpha = 1 - pp.age / 1.2;
      ctx.fillStyle = pp.color;
      ctx.fillText(pp.txt, pp.x, pp.y - pp.age * 34);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- public API ---------- */
  return {
    init: reset,
    resize: function (w, h) {
      W = w; H = h;
      sub.x = clamp(sub.x, 44, W - 44);
      sub.y = clamp(sub.y, 0.09 * H, 0.86 * H);
    },
    update: update,
    drawBack: drawBack,
    drawFront: drawFront,
    drawDark: drawDark,
    setKey: function (name, down) {
      if (name === 'up' && down && !keys.up) upImpulse = true;
      keys[name] = down;
    },
    subPointer: function () { return { x: sub.x, y: sub.y, active: !over, down: false }; },
    motion: function () {   // for the engine sound
      return {
        thrust: !over && (keys.left || keys.right || keys.up || keys.down),
        speed: sub ? Math.hypot(sub.vx, sub.vy) : 0
      };
    },
    threats: function () {   // ground threats fish should scatter from
      var out = [];
      for (var i = 0; i < crabs.length; i++) out.push({ x: crabs[i].x, y: crabs[i].y, r: 130 });
      return out;
    },
    forceStage: function (s) {
      stage = clamp(s, 1, 3);
      stageProg = 0;   // a manual choice sticks; progression restarts from here
      resetRun();      // touch the pill, the run resets — tourist mode
      charge = 1;
      if (stage === 3) makeGlowers();
    },
    drainToasts: function () { var t = toasts; toasts = []; return t; },
    progress: function () { return { unlocked: unlocked, run: run, globals: glob }; },
    state: function () { return { hp: hp, maxHp: MAX_HP, score: score, over: over, stage: stage, stageName: STAGE_NAME[stage - 1], shield: shield }; }
  };
})();
// Main harness — water/coral/fish scene + game loop, HUD, keyboard controls.
(() => {
  window.SHARK_IMG = document.getElementById('shark-img');
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const SEED_KEY = 'underwater-scene-seed';
  let stored = null;
  try { stored = localStorage.getItem(SEED_KEY); } catch (e) {}
  window.SCENE_SEED = stored !== null ? (Number(stored) >>> 0) : newSeed();

  function newSeed() {
    const s = (Math.random() * 0xffffffff) >>> 0;
    try { localStorage.setItem(SEED_KEY, String(s)); } catch (e) {}
    return s;
  }

  function buildScene() {
    WaterLayer.init(W, H);
    CoralLayer.init(W, H);
    FishLayer.init(W, H, CoralLayer.shelters);
    GameLayer.init(W, H);
  }

  size();
  buildScene();

  // debug: open game.html#s2 / #s3 to jump straight to a stage
  if (location.hash === '#s2') GameLayer.forceStage(2);
  else if (location.hash === '#s3') GameLayer.forceStage(3);

  // the stage pill cycles Day → Night → Abyss (hashes don't reach the artifact)
  document.getElementById('stage').addEventListener('click', () => {
    GameLayer.forceStage(GameLayer.state().stage % 3 + 1);
  });

  // new reef: reroll the seed and rebuild the scenery, keep the game running
  document.getElementById('reset').addEventListener('click', e => {
    e.currentTarget.blur();   // keep space from re-clicking the button
    window.SCENE_SEED = newSeed();
    WaterLayer.init(W, H);
    CoralLayer.init(W, H);
    FishLayer.init(W, H, CoralLayer.shelters);
  });

  window.addEventListener('resize', () => {
    size();
    WaterLayer.resize(W, H);
    CoralLayer.resize(W, H);
    FishLayer.resize(W, H, CoralLayer.shelters);
    GameLayer.resize(W, H);
  });

  // ---- keyboard ----
  const keyName = code =>
    code === 'ArrowLeft' || code === 'KeyA' ? 'left' :
    code === 'ArrowRight' || code === 'KeyD' ? 'right' :
    code === 'ArrowDown' || code === 'KeyS' ? 'down' :
    code === 'Space' || code === 'ArrowUp' || code === 'KeyW' ? 'up' : null;
  window.addEventListener('keydown', e => {
    const k = keyName(e.code);
    if (k) { e.preventDefault(); if (!e.repeat) GameLayer.setKey(k, true); }
  });
  window.addEventListener('keyup', e => {
    const k = keyName(e.code);
    if (k) GameLayer.setKey(k, false);
  });

  // ---- touch: drag = swipe-steer (left/right/down/up), quick tap = space ----
  const DEAD = 22, TAP_MS = 350;
  const drags = new Map();
  const applyDrag = (dx, dy) => {
    GameLayer.setKey('left', dx < -DEAD);
    GameLayer.setKey('right', dx > DEAD);
    GameLayer.setKey('down', dy > DEAD);
    GameLayer.setKey('up', dy < -DEAD);
  };
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    drags.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), moved: false });
  });
  canvas.addEventListener('pointermove', e => {
    const d = drags.get(e.pointerId);
    if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (Math.abs(dx) > DEAD || Math.abs(dy) > DEAD) d.moved = true;
    if (d.moved) applyDrag(dx, dy);
  });
  const endDrag = e => {
    const d = drags.get(e.pointerId);
    if (!d) return;
    drags.delete(e.pointerId);
    if (!d.moved && performance.now() - d.t < TAP_MS) {
      GameLayer.setKey('up', true);   // edge-triggers the space impulse
      GameLayer.setKey('up', false);
    } else if (drags.size === 0) {
      applyDrag(0, 0);
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---- HUD ----
  const heartsEl = document.getElementById('hearts');
  const scoreEl = document.getElementById('score');
  const stageEl = document.getElementById('stage');
  const overEl = document.getElementById('over');
  const finalEl = document.getElementById('final');
  const hintEl = document.getElementById('hint');
  let lastHp = -1, lastScore = -1, lastStage = -1, lastShield = -1, shownOver = false;

  setTimeout(() => { hintEl.style.opacity = '0'; }, 9000);

  function updateHud() {
    const s = GameLayer.state();
    if (s.hp !== lastHp || s.shield !== lastShield) {
      lastHp = s.hp;
      lastShield = s.shield;
      let html = '';
      for (let i = 0; i < s.maxHp; i++) {
        html += i < s.hp ? '♥' : '<span class="lost">♥</span>';
      }
      if (s.shield) html += ' \u{1FAE7}';
      heartsEl.innerHTML = html;
    }
    if (s.score !== lastScore) {
      lastScore = s.score;
      scoreEl.textContent = '\u{1F5D1} ' + s.score;
    }
    if (s.stage !== lastStage) {
      lastStage = s.stage;
      stageEl.textContent = s.stageName;
    }
    for (const id of GameLayer.drainToasts()) toastQ.push(id);
    showNextToast();
    if (s.over && !shownOver) {
      shownOver = true;
      finalEl.textContent = 'You collected ' + s.score + ' pieces of trash. The ocean thanks you!';
      overEl.classList.add('show');
    }
  }

  // ---- achievements: catalog, toast queue, badge wall ----
  const BADGES = [
    ['trash10',  'First Haul',        'Collect 10 pieces of trash'],
    ['trash100', 'Beach Cleanup',     'Collect 100 pieces of trash'],
    ['trash1000','Ocean Steward',     'Collect 1,000 pieces of trash'],
    ['run100',   'Century Dive',      'Collect 100 trash in a single run'],
    ['night',    'Night Swimmer',     'Reach the night'],
    ['abyss',    'Into the Dark',     'Get dragged into the abyss'],
    ['turtle1',  "Turtle's Friend",   'Rescue a hunted plastic bag'],
    ['turtle5',  'Shell Guardian',    'Save 5 bags from hungry turtles'],
    ['shield1',  'Bubble Banker',     'Bank a bubble shield at full hearts'],
    ['ko1',      'Revenge!',          'KO a shark with your shield'],
    ['koAbyss',  'Abyss Avenger',     'KO a shark down in the abyss'],
    ['crab1',    'Crab Mugger',       'Reclaim stolen trash from a crab'],
    ['duck1',    'Duck Collector',    'Catch the rubber duck'],
    ['hoarder',  'One of Everything', 'Collect all 10 kinds of trash'],
    ['sweep',    'Clean Sweep',       'All 10 kinds of trash in one run'],
    ['secret',   '???',               '???'],
  ];
  const SECRET_NAME = 'Taken by the Shark, Repaid in Full';
  const SECRET_DESC = "Dragged into the abyss by a shark's bite — then send one to the surface, belly-up";
  const toastEl = document.getElementById('toast');
  const toastQ = [];
  let toastBusy = false;
  function showNextToast() {
    if (toastBusy || !toastQ.length) return;
    toastBusy = true;
    const id = toastQ.shift();
    const b = BADGES.find(x => x[0] === id);
    const name = id === 'secret' ? SECRET_NAME : (b ? b[1] : id);
    toastEl.innerHTML = '\u{1F3C6} <b>' + name + '</b>';
    toastEl.classList.add('show');
    setTimeout(() => {
      toastEl.classList.remove('show');
      setTimeout(() => { toastBusy = false; showNextToast(); }, 350);
    }, 3500);
  }

  function relTime(ts) {
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (days <= 0) return 'completed today';
    if (days === 1) return 'completed yesterday';
    if (days < 365) return 'completed ' + days + ' days ago';
    return 'completed long ago';
  }

  const badgesEl = document.getElementById('badges');
  document.getElementById('showBadges').addEventListener('click', () => {
    const prog = GameLayer.progress();
    const list = document.getElementById('badge-list');
    list.innerHTML = '';
    for (const [id, name, desc] of BADGES) {
      const ts = prog.unlocked[id];
      const secretLocked = id === 'secret' && !ts;
      const row = document.createElement('div');
      row.className = 'badge' + (ts ? '' : ' locked');
      row.innerHTML =
        '<div class="bname">' + (ts && id === 'secret' ? SECRET_NAME : name) + '</div>' +
        '<div class="bdesc">' + (ts && id === 'secret' ? SECRET_DESC : (secretLocked ? '???' : desc)) + '</div>' +
        (ts ? '<div class="btime">' + relTime(ts) + '</div>' : '');
      list.appendChild(row);
    }
    badgesEl.classList.add('show');
  });
  document.getElementById('badgesClose').addEventListener('click', () => {
    badgesEl.classList.remove('show');
  });

  document.getElementById('again').addEventListener('click', e => {
    e.currentTarget.blur();   // keep space from re-clicking the button
    GameLayer.init(W, H);
    shownOver = false;
    overEl.classList.remove('show');
  });

  let last = performance.now();
  function frame(now) {
    const t = now / 1000;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const abyss = GameLayer.state().stage === 3;
    CoralLayer.setKelpGlow(abyss);
    WaterLayer.drawBackground(ctx, t,
      abyss ? '#755d64' : null,   // abyss sand: darker brown, purplish cast
      abyss ? '#5a464f' : null);
    CoralLayer.drawBack(ctx, t);
    GameLayer.update(dt, t, FishLayer);
    FishLayer.update(dt, t, GameLayer.subPointer(), GameLayer.threats()); // fish dodge the sub and crabs
    GameLayer.drawBack(ctx, t);
    FishLayer.draw(ctx, t);
    GameLayer.drawFront(ctx, t);
    CoralLayer.drawFront(ctx, t);
    GameLayer.drawDark(ctx, t);
    WaterLayer.drawOverlay(ctx, t, !abyss);   // no surface waves this deep down
    updateHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
// AudioLayer — synthesized ambient underwater sound. Everything routes through one
// global lowpass ("muffle") so it sounds heard-through-water. Layers: brown-noise
// current bed with two slow LFO swells, a deep drone, random bubble clusters, and
// a rare whale-ish moan. Starts on the first user gesture (autoplay policy);
// the 🔊 button toggles mute. Stage-aware: deeper stages muffle harder.
(() => {
  const btn = document.getElementById('mute');
  let ctx = null, master = null, muffle = null, droneG = null;
  let out = null, sfx = null, hissBuf = null, engOsc = null, engG = null;
  let muted = false, timers = [], lastScore = -1, lastHp = -1, lastShield = 0;
  const VOLUME = 0.22;

  function build() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    // out = the mute bus; ambience reaches it through the muffle, SFX on a
    // brighter side-chain so plings/hits cut through the underwater wash
    out = ctx.createGain(); out.gain.value = 1;
    out.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = VOLUME;
    muffle = ctx.createBiquadFilter();
    muffle.type = 'lowpass'; muffle.frequency.value = 750; muffle.Q.value = 0.4;
    master.connect(muffle); muffle.connect(out);
    const sfxLP = ctx.createBiquadFilter();
    sfxLP.type = 'lowpass'; sfxLP.frequency.value = 2400; sfxLP.Q.value = 0.5;
    sfx = ctx.createGain(); sfx.gain.value = 0.6;
    sfx.connect(sfxLP); sfxLP.connect(out);

    // ---- current bed: looped brown noise, heavily lowpassed ----
    const len = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let v = 0;
    for (let i = 0; i < len; i++) {
      v = (v + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = v * 3.5;
    }
    // crossfade-free loop: taper both ends to the same value
    for (let i = 0; i < 4000; i++) {
      const k = i / 4000;
      d[i] *= k; d[len - 1 - i] *= k;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    const noiseLP = ctx.createBiquadFilter();
    noiseLP.type = 'lowpass'; noiseLP.frequency.value = 240; noiseLP.Q.value = 0.7;
    const noiseG = ctx.createGain(); noiseG.gain.value = 0.55;
    noise.connect(noiseLP); noiseLP.connect(noiseG); noiseG.connect(master);
    noise.start();

    // two incommensurate slow LFOs = non-repeating swell (filter sweep + volume)
    const lfo1 = ctx.createOscillator(); lfo1.frequency.value = 0.071;
    const lfo1Amt = ctx.createGain(); lfo1Amt.gain.value = 110;
    lfo1.connect(lfo1Amt); lfo1Amt.connect(noiseLP.frequency); lfo1.start();
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.043;
    const lfo2Amt = ctx.createGain(); lfo2Amt.gain.value = 0.16;
    lfo2.connect(lfo2Amt); lfo2Amt.connect(noiseG.gain); lfo2.start();

    // ---- deep pressure drone ----
    const drone = ctx.createOscillator();
    drone.type = 'sine'; drone.frequency.value = 52;
    droneG = ctx.createGain(); droneG.gain.value = 0.05;
    drone.connect(droneG); droneG.connect(master); drone.start();

    // ---- sub engine: saw hum + prop-wash noise, swells while thrusting ----
    engG = ctx.createGain(); engG.gain.value = 0;
    engG.connect(master);
    engOsc = ctx.createOscillator();
    engOsc.type = 'sawtooth'; engOsc.frequency.value = 55;
    const engLP = ctx.createBiquadFilter();
    engLP.type = 'lowpass'; engLP.frequency.value = 190; engLP.Q.value = 1.1;
    engOsc.connect(engLP); engLP.connect(engG); engOsc.start();
    const chug = ctx.createOscillator(); chug.frequency.value = 9;   // prop chug wobble
    const chugAmt = ctx.createGain(); chugAmt.gain.value = 4;
    chug.connect(chugAmt); chugAmt.connect(engOsc.frequency); chug.start();
    const wash = ctx.createBufferSource();
    wash.buffer = buf; wash.loop = true; wash.playbackRate.value = 1.7;
    const washBP = ctx.createBiquadFilter();
    washBP.type = 'bandpass'; washBP.frequency.value = 300; washBP.Q.value = 0.6;
    const washG = ctx.createGain(); washG.gain.value = 0.8;
    wash.connect(washBP); washBP.connect(washG); washG.connect(engG); wash.start();

    // short white-noise burst reused by the hit sound
    const hl = Math.floor(ctx.sampleRate * 0.4);
    hissBuf = ctx.createBuffer(1, hl, ctx.sampleRate);
    const hd = hissBuf.getChannelData(0);
    for (let i = 0; i < hl; i++) hd[i] = Math.random() * 2 - 1;

    scheduleBubbles();
    scheduleMoan();
    requestAnimationFrame(tick);
    // stage-aware muffling: Night/Abyss close the filter and lift the drone
    timers.push(setInterval(() => {
      const s = window.GameLayer ? GameLayer.state().stage : 1;
      const f = s === 3 ? 380 : s === 2 ? 550 : 750;
      muffle.frequency.linearRampToValueAtTime(f, ctx.currentTime + 2);
      droneG.gain.linearRampToValueAtTime(s === 3 ? 0.09 : 0.05, ctx.currentTime + 2);
    }, 1000));
  }

  // per-frame: drive the engine from sub motion, fire SFX on score/hp changes
  function tick() {
    const now = ctx.currentTime;
    const m = GameLayer.motion();
    const target = m.thrust ? 0.3 : Math.min(m.speed / 300, 1) * 0.07; // idle drift = faint wash
    engG.gain.setTargetAtTime(target, now, m.thrust ? 0.07 : 0.35);
    engOsc.frequency.setTargetAtTime(55 + Math.min(m.speed, 280) * 0.1, now, 0.12);
    const s = GameLayer.state();
    if (lastScore >= 0 && s.score > lastScore) pling();
    if (lastHp >= 0 && s.hp < lastHp) {          // restarts only raise hp, so no false hit
      // one slash per heart lost — a shark hit sounds like five, staggered
      const n = Math.min(lastHp - s.hp, 5);
      for (let i = 0; i < n; i++) slash(i * 0.08);
    }
    // shield burst: flag drops with hp intact (score guard skips restarts)
    if (lastShield === 1 && !s.shield && s.hp === lastHp && s.score >= lastScore) plop();
    lastScore = s.score; lastHp = s.hp; lastShield = s.shield;
    requestAnimationFrame(tick);
  }

  // trash collected: two glassy sine partials, quick decay
  function pling() {
    const t0 = ctx.currentTime;
    [[880, 0.11, 0], [1320, 0.05, 0.03]].forEach(([f, vol, dly]) => {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f, t0 + dly);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0 + dly);
      g.gain.exponentialRampToValueAtTime(vol, t0 + dly + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dly + 0.4);
      o.connect(g); g.connect(sfx);
      o.start(t0 + dly); o.stop(t0 + dly + 0.45);
    });
  }

  // bubble shield burst: quick pitch-drop blip + soft washy pop
  function plop() {
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(340, t0);
    o.frequency.exponentialRampToValueAtTime(90, t0 + 0.09);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o.connect(g); g.connect(sfx);
    o.start(t0); o.stop(t0 + 0.2);
    const src = ctx.createBufferSource(); src.buffer = hissBuf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t0);
    ng.gain.exponentialRampToValueAtTime(0.09, t0 + 0.01);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
    src.connect(lp); lp.connect(ng); ng.connect(sfx);
    src.start(t0); src.stop(t0 + 0.12);
  }

  // heart lost: swept noise slash + low thump; dly staggers burst voices,
  // and every call builds its own bandpass so overlaps don't retrigger
  function slash(dly) {
    const t0 = ctx.currentTime + (dly || 0);
    const src = ctx.createBufferSource(); src.buffer = hissBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(1700, t0);
    bp.frequency.exponentialRampToValueAtTime(280, t0 + 0.26);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
    src.connect(bp); bp.connect(g); g.connect(sfx);
    src.start(t0); src.stop(t0 + 0.35);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(120, t0);
    o.frequency.exponentialRampToValueAtTime(55, t0 + 0.18);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.exponentialRampToValueAtTime(0.16, t0 + 0.015);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
    o.connect(og); og.connect(sfx);
    o.start(t0); o.stop(t0 + 0.3);
  }

  // short rising sine blip = one bubble; clusters of 2–5
  function bubble(t0) {
    const o = ctx.createOscillator(); o.type = 'sine';
    const f = 350 + Math.random() * 500;
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 1.6, t0 + 0.08);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.03, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + 0.2);
  }
  function scheduleBubbles() {
    timers.push(setTimeout(() => {
      const n = 2 + Math.floor(Math.random() * 4);
      let t = ctx.currentTime + 0.05;
      for (let i = 0; i < n; i++) t += 0.06 + Math.random() * 0.1, bubble(t);
      scheduleBubbles();
    }, 1500 + Math.random() * 5000));
  }

  // rare distant moan: slow downward sine glide, gentle swell
  function scheduleMoan() {
    timers.push(setTimeout(() => {
      const t0 = ctx.currentTime;
      const base = 62 + Math.random() * 25;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(base, t0);
      o.frequency.linearRampToValueAtTime(base * 0.78, t0 + 3.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.045, t0 + 1.4);
      g.gain.linearRampToValueAtTime(0.0001, t0 + 3.8);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + 4);
      scheduleMoan();
    }, 18000 + Math.random() * 25000));
  }

  let startedAt = -1;
  function start() {
    if (!ctx) {
      build();
      startedAt = performance.now();
      btn.innerHTML = '&#128266;';   // icon shows 🔇 until audio really runs
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  // any first gesture starts the ambience (browser autoplay policy)
  window.addEventListener('pointerdown', start, { once: false });
  window.addEventListener('keydown', start, { once: false });

  btn.addEventListener('click', e => {
    e.currentTarget.blur();
    start();
    // the pointerdown of this same tap may have just enabled audio — that tap
    // means "turn on", not "toggle to mute"
    if (performance.now() - startedAt < 600) return;
    muted = !muted;
    btn.innerHTML = muted ? '&#128263;' : '&#128266;';
    out.gain.linearRampToValueAtTime(muted ? 0 : 1, ctx.currentTime + 0.25);
  });
})();
</script>
</body>
